name: Local Lua Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-tests:
    name: Lua + settings panel tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install -r others/script/requirements-dev.txt

      - name: Run tests
        run: make -C others/script test PYTHON=python3

      - name: Check custom patch drift
        run: ruby others/script/check_custom_patch.rb
