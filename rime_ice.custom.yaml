# 雾凇拼音方案级补丁（rime_ice.custom.yaml）
# 方案文件的 custom 补丁：对本方案的 engine/translator/editor 等做修改
# 此文件被 git 忽略，git pull 更新词库不受影响
patch:
  # 只上屏英文释义：候选高亮时按 Ctrl+E，仅输出该候选的英文注释（不含中文词本身）
  # 对英文候选同样适用（此时上屏中文释义）；候选无释义时无动作
  # （Ctrl+E 原绑定为「候选+释义一起上屏」，已在 dict_commit_processor.lua 中移除）
  "editor/bindings/Control+e": commit_comment

  # 处理器链：列表是整体替换，以下为 rime_ice.schema.yaml 原列表 + 插入的新处理器
  # （fork 更新若改动了 processors 列表，需对照同步）
  engine/processors:
    - lua_processor@*select_character
    - lua_processor@*dict_commit_processor
    - lua_processor@*comment_rank_commit   # 新增：英文候选 Ctrl+E/R 按顺位上屏释义
    - lua_processor@*markdown_processor
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
