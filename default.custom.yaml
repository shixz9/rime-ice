# 输入行为设置（自定义补丁）
# 由「Rime 设置面板」生成于 2026-10-17 15:37；手动修改会被下次面板保存覆盖
# 注意：不要直接改 default.yaml —— 那是上游仓库文件，git pull 会被覆盖；一律写在这里
# 上游校验：ruby others/script/check_custom_patch.rb
patch:
  # 方案列表：Rime 对列表为整体替换，须完整重列；t9 已随其方案文件删除而去除
  schema_list:
    - schema: rime_ice
    - schema: double_pinyin
    - schema: double_pinyin_abc
    - schema: double_pinyin_mspy
    - schema: double_pinyin_sogou
    - schema: double_pinyin_flypy
    - schema: double_pinyin_ziguang
    - schema: double_pinyin_jiajia

  menu:
    page_size: 9        # 每页候选词数量

  switcher:
    hotkeys:
      - "Control+grave"   # Ctrl+` 切换输入方案
      - "F4"

  ascii_composer:
    good_old_caps_lock: true   # Caps Lock 切换中英
    switch_key:
      Shift_L: commit_code   # 左 Shift：上屏拼音编码转英文
      Shift_R: inline_ascii  # 右 Shift：临时英文，回车回中文

  # ⚠️ Rime 对列表是整体替换不是追加，以下包含上游默认绑定 + 自定义；
  #    上游 key_binder 变更时执行 check_custom_patch.rb 对照同步
  key_binder:
    select_first_character: "bracketleft"    # 以词定字：取首字
    select_last_character: "bracketright"    # 以词定字：取尾字
    bindings:
    - { when: "composing", accept: "Shift+Tab", send: "Shift+Left" }
    - { when: "composing", accept: "Tab", send: "Shift+Right" }
    - { when: "composing", accept: "Alt+Left", send: "Shift+Left" }
    - { when: "composing", accept: "Alt+Right", send: "Shift+Right" }
    - { when: "has_menu", accept: "minus", send: "Page_Up" }
    - { when: "has_menu", accept: "equal", send: "Page_Down" }
    - { when: "always", accept: "Control+Shift+3", toggle: "ascii_punct" }
    - { when: "always", accept: "Control+Shift+numbersign", toggle: "ascii_punct" }
    - { when: "always", accept: "Control+Shift+4", toggle: "traditionalization" }
    - { when: "always", accept: "Control+Shift+dollar", toggle: "traditionalization" }
    - { when: "composing", accept: "KP_0", send: "0" }
    - { when: "composing", accept: "KP_1", send: "1" }
    - { when: "composing", accept: "KP_2", send: "2" }
    - { when: "composing", accept: "KP_3", send: "3" }
    - { when: "composing", accept: "KP_4", send: "4" }
    - { when: "composing", accept: "KP_5", send: "5" }
    - { when: "composing", accept: "KP_6", send: "6" }
    - { when: "composing", accept: "KP_7", send: "7" }
    - { when: "composing", accept: "KP_8", send: "8" }
    - { when: "composing", accept: "KP_9", send: "9" }
    - { when: "composing", accept: "KP_Decimal", send: "period" }
    - { when: "composing", accept: "KP_Multiply", send: "asterisk" }
    - { when: "composing", accept: "KP_Add", send: "plus" }
    - { when: "composing", accept: "KP_Subtract", send: "minus" }
    - { when: "composing", accept: "KP_Divide", send: "slash" }
    - { when: "composing", accept: "KP_Enter", send: "Return" }
    - { when: "has_menu", accept: "comma", send: "Page_Up" }
    - { when: "has_menu", accept: "period", send: "Page_Down" }

  # 注：editor 绑定属方案级配置（Ctrl+E 等），改 rime_ice.custom.yaml。

  # ── 与上游的已知分歧（2026-10-17 逐项核对，均决定保留本地行为）──────
  # 1. switcher/save_options 含 dict_comment（上游 da1fbe6 已移除）：
  #    差异仅在「词典释义开关是否跨会话记忆」——本地=记忆；上游=不记忆，
  #    回落到 rime_ice.schema.yaml 的 reset: 1（默认开）。本地用
  #    Ctrl+Shift+E 频繁切换该开关，保留记忆更顺手，暂不向上游对齐。
  # 2. key_binder /（rime_ice.custom.yaml 的）processors 为整体替换列表，
  #    上游新增的绑定/处理器不会自动继承。每次 git pull 更新后执行：
  #      ruby others/script/check_custom_patch.rb
  #    出现 DRIFT 时，把上游新增项补进对应 custom 文件，再重新部署。
